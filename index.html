<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SAV Flight Operations Board</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:
        linear-gradient(
            rgba(0,0,0,.60),
            rgba(0,0,0,.60)
        ),
        url('operations-background.jpg');

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;

    color:white;
    min-height:100vh;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:20px 40px;

    background:rgba(0,0,0,.4);
    border-bottom:3px solid #ff6600;
}

.title{
    font-size:2rem;
    font-weight:bold;
    color:white;
}

.clock{
    font-size:2rem;
    font-weight:bold;
    color:#00d9ff;
}

.updated{
    text-align:center;
    padding:12px;
    color:#ddd;
    font-size:1rem;
}

/* NEXT EVENT PANEL */

.next-event-panel{
    width:90%;
    max-width:850px;

    margin:15px auto 25px auto;

    background:rgba(25,25,25,.85);

    border:3px solid #ff6600;
    border-radius:15px;

    padding:25px;

    text-align:center;

    backdrop-filter:blur(4px);

    box-shadow:0 0 25px rgba(255,102,0,.4);
}

.next-event-title{
    font-size:1.2rem;
    color:#cccccc;
    letter-spacing:3px;
}

.next-flight{
    font-size:3rem;
    font-weight:bold;
    margin-top:10px;
}

.next-type{
    font-size:1.5rem;
    margin-top:10px;
}

.next-countdown{
    font-size:4rem;
    font-weight:bold;
    color:#00d9ff;
    margin-top:15px;
}

.next-time{
    margin-top:10px;
    color:#ddd;
    font-size:1.2rem;
}

/* FLIGHT CARDS */

.board{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:25px;

    padding:25px;
}

.flight-card{
    background:rgba(25,25,25,.82);

    border:2px solid #ff6600;
    border-radius:12px;

    padding:25px;

    text-align:center;

    backdrop-filter:blur(3px);
}

.flight-number{
    font-size:2rem;
    color:#ff6600;
    margin-bottom:12px;
    font-weight:bold;
}

.flight-time{
    font-size:1.2rem;
    margin-bottom:15px;
}

.status{
    font-size:1.3rem;
    font-weight:bold;
    margin-bottom:15px;
}

.countdown{
    font-size:2.3rem;
    font-weight:bold;
}

.arrived,
.departed{
    color:#00ff66;
}

.enroute{
    color:#00bfff;
}

.preparing{
    color:#ffd700;
}

.footer{
    text-align:center;
    padding:20px;
    color:#ccc;
    font-size:.9rem;
}

@media(max-width:900px){

    .board{
        grid-template-columns:1fr;
    }

    .next-countdown{
        font-size:3rem;
    }

    .next-flight{
        font-size:2.2rem;
    }
}

</style>
</head>

<body>

<div class="header">
    <div class="title">
        SAV FLIGHT OPERATIONS BOARD
    </div>

    <div id="clock" class="clock">
        00:00:00
    </div>
</div>

<div id="lastUpdated" class="updated"></div>

<!-- NEXT EVENT -->

<div class="next-event-panel">

    <div class="next-event-title">

    </div>

    <div id="nextFlight" class="next-flight">

    </div>

    <div id="nextType" class="next-type">

    <div id="nextCountdown" class="next-countdown">
        00:00:00
    </div>

    <div id="nextTime" class="next-time">
        ETA 17:15
    </div>

</div>
